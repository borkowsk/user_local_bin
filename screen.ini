## DISPLAY CONFIGURATION - THIS FILE IS INCLUDED IN VARIOUS  *.sh SCRIPTS
## BUT THE BEST METHOD IS TO SOURCE IT INTO .bashrc
## @date 2026-11-17 (last modification)
## @author wborkowski@uw.edu.pl

STR="$TERM"
#echo "TERM:" $STR

#ENABLING COLORn ENV.VARIABLES ONLY WHEN terminal HAS COLOR POSSIBILITIES:
SUB='color' #see also https://unix.stackexchange.com/questions/450365/check-if-terminal-supports-24-bit-true-color

if [[ "$STR" == *"$SUB"* ]]; then

    
    export COLOR0="\e[37m" #ŻADEN?
    export COLOR1="\e[36m" #CYAN
    export COLOR2="\e[35m" #MAGENTA
    export COLOR3="\e[34m" #BLUE
    export COLOR4="\e[33m" #YELLOW
    export COLOR5="\e[32m" #GREEN
    export COLOR6="\e[31m" #RED
    export COLOR7="\e[30m" #DARK

    export COLERR="\e[31m" #RED
    export COLFIL="\e[34m" #BLUE
    export NORMCO="\e[0m"  #NORMALIZACJA KOLORU

    echo -e $COLOR1$SUB$COLOR2" is there."$NORMCO

    STR=`uname -or`
    #echo "UNAME:" $STR
    SUB='Linux'

    if [[ "$STR" == *"$SUB"* ]]; then

      echo -e $COLOR1$SUB$COLOR4" is there."$NORMCO

    fi
else

    export COLOR0=""
    export COLOR1=""
    export COLOR2=""
    export COLOR3=""
    export COLOR4=""
    export COLOR5=""
    export COLOR6=""
    export COLOR7=""

    export COLERR=""
    export COLFIL=""
    export NORMCO=""

fi

export ECHO="echo -e"

